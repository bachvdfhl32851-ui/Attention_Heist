<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kết quả — Attention Heist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="result">

  <main>
    <section class="screen" id="screenResult" aria-labelledby="resultTitle">
      <p class="result-label">Kết quả của bạn</p>
      <h2 class="result-title" id="resultTitle" tabindex="-1">Kết quả theo từng nhóm</h2>
      <p class="result-desc">Mỗi nhóm gồm 3 câu hỏi, điểm từ 0 đến 12. Kết quả giúp bạn hiểu thói quen hiện tại của mình, nhận diện những nguy cơ và biết nên bắt đầu thay đổi từ đâu.</p>

      <ol class="group-results" id="groupResults"></ol>
      <div id="levelDetails"></div>

      <p class="result-note">Đây là bảng tự đánh giá mang tính tham khảo, không phải chẩn đoán y khoa.</p>

      <div class="result-actions">
        <button type="button" class="btn btn-primary" id="retryBtn">Làm lại bài test</button>
        <button type="button" class="btn btn-ghost" id="homeBtn">Về trang giới thiệu</button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
