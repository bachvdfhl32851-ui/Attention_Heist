<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhóm 4: Sức khỏe tinh thần &amp; Cảm xúc — Attention Heist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="group" data-group="4">

  <main>

    <section class="screen" id="screenReady" aria-labelledby="readyTitle">
      <p class="group-label">Nhóm 4 / 5</p>
      <h1 class="ready-title" id="readyTitle" tabindex="-1">Sức khỏe tinh thần &amp; Cảm xúc</h1>
      <p class="ready-en">Mental Health</p>
      <p class="ready-info">Nhóm này có 3 câu hỏi. Với mỗi câu, hãy chọn mức độ đúng nhất với bạn, từ “Không bao giờ” đến “Luôn luôn”.</p>
      <p class="ready-ask">Bạn đã sẵn sàng chưa?</p>
      <button type="button" class="btn btn-primary" id="readyBtn">Sẵn sàng</button>
    </section>

    <section class="screen" id="screenQuiz" aria-labelledby="questionText" hidden>
      <div class="quiz-top">
        <p class="group-label">Nhóm 4 / 5</p>
        <p class="group-name">Sức khỏe tinh thần &amp; Cảm xúc <span>(Mental Health)</span></p>
        <p class="quiz-count" id="quizCount" aria-live="polite">Câu 10 / 15</p>
        <div class="quiz-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="quizBar">
          <span id="quizBarFill"></span>
        </div>
      </div>

      <h2 class="question" id="questionText" tabindex="-1"></h2>

      <div class="options" id="options" role="radiogroup" aria-labelledby="questionText"></div>

      <div class="quiz-nav">
        <button type="button" class="btn btn-ghost" id="backBtn">Câu trước</button>
        <button type="button" class="btn btn-primary" id="nextBtn" disabled>Câu tiếp theo</button>
      </div>
      <p class="key-hint">Mẹo: nhấn phím 1–5 để chọn nhanh đáp án.</p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
